[package]
name = "yar-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Rust implementation of the Yar RPC framework"
license = "Apache-2.0"
repository = "https://github.com/lovelock/yar-rs"
homepage = "https://github.com/lovelock/yar-rs"
documentation = "https://docs.rs/yar-rs"
readme = "README.md"
authors = [
    "lovelock <happyhackerwqc@foxmail.com>",
    "Xinchen Hui <laruence@gmail.com>",
]
keywords = ["rpc", "yar", "msgpack", "php", "async"]
categories = ["network-programming", "api-bindings"]
exclude = [
    "/.dockerignore",
    "/.gitignore",
    "/docs/superpowers",
    "/profile",
    "/results",
]

[features]
default = []
# Benchmark/load-generation tooling; not part of the RPC API.
profiler = []

[dependencies]
# msgpack serialization
rmp = "0.8"

# async runtime for server
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "io-util",
    "macros",
] }

# logging
chrono = "0.4"

# byte order handling
byteorder = "1.5"

# error handling
thiserror = "2"

[[bin]]
name = "profiler"
path = "src/bin/profiler.rs"
required-features = ["profiler"]

# docs.rs builds the full API, including the feature-gated profiler module.
[package.metadata.docs.rs]
all-features = true
