[package]
name = "yar-rs"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of the Yar RPC framework"
license = "Apache-2.0"

[dependencies]
# msgpack serialization
rmp = "0.8"
rmp-serde = "1.1"
serde = { version = "1.0", features = ["derive"] }

# async runtime for server
tokio = { version = "1", features = ["full"] }

# logging
log = "0.4"
env_logger = "0.11"
chrono = "0.4"

# byte order handling
byteorder = "1.5"

# error handling
thiserror = "2"

[dev-dependencies]
tokio-test = "0.4"
